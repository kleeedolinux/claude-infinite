[project]
name = "claude-infinite"
version = "0.1.0"
description = "Infinite, self-correcting memory and project organization for Claude Code (stdlib only)"
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
dependencies = []

[project.urls]
Homepage = "https://github.com/kleeedolinux/claude-infinite"

[project.scripts]
mem = "infinite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infinite"]
