[project]
name = "claudeinfinite"
version = "0.1.0"
description = "Infinite, self-correcting memory and project organization for Claude Code (stdlib only)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mem = "infinite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infinite"]
