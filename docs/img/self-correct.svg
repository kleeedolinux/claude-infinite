<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="How memory fixes itself: write-time checks and the learning loop">
<title>How memory fixes itself: write-time checks and the learning loop</title>
<style>
.h{font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#111}
.sub{font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#666}
.t{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#111}
.tb{font:600 12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#111}
.s{font:12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#555}
.m{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#888}
.ta{font:600 12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#3451d1}
.box{fill:#fbfbfb;stroke:#d4d4d4;stroke-width:1.1}
.acc{fill:#f1f4ff;stroke:#3451d1;stroke-width:1.2}
.warn{fill:#fff6ee;stroke:#d9480f;stroke-width:1.2}
.tw{font:600 12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#d9480f}
.ln{stroke:#a3a3a3;stroke-width:1.1;fill:none}
.la{stroke:#3451d1;stroke-width:1.3;fill:none}
.lw{stroke:#d9480f;stroke-width:1.3;fill:none}
.dash{stroke:#c4c4c4;stroke-width:1;fill:none;stroke-dasharray:3 4}
.dot{fill:#111}.dota{fill:#3451d1}
.cell{fill:#e9e9e9}.cella{fill:#3451d1}
.ah{fill:#a3a3a3}.aha{fill:#3451d1}.ahw{fill:#d9480f}
@media (prefers-color-scheme: dark){
.h,.t,.tb{fill:#ececec}.sub{fill:#a0a0a0}.s{fill:#b0b0b0}.m{fill:#8a8a8a}
.ta{fill:#8aa4ff}.tw{fill:#ff8a4c}
.box{fill:#141414;stroke:#3a3a3a}.acc{fill:#121a33;stroke:#8aa4ff}.warn{fill:#2a1709;stroke:#ff8a4c}
.ln{stroke:#6a6a6a}.la{stroke:#8aa4ff}.lw{stroke:#ff8a4c}.dash{stroke:#444}
.dot{fill:#ececec}.dota{fill:#8aa4ff}.cell{fill:#2c2c2c}.cella{fill:#8aa4ff}
.ah{fill:#6a6a6a}.aha{fill:#8aa4ff}.ahw{fill:#ff8a4c}}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="aha"/></marker>
<marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ahw"/></marker>
</defs>
<text x="28" y="36" class="h" text-anchor="start">Memory that fixes itself</text>
<text x="28" y="58" class="sub" text-anchor="start">Left: every write is checked against what is already known. Right: mistakes become rules.</text>
<rect x="40" y="90" width="200" height="56" rx="7" class="acc"/>
<text x="52" y="112" class="ta" text-anchor="start">mem note "..."</text>
<text x="52" y="132" class="s" text-anchor="start">a new fact, decision, lesson</text>
<path d="M140,146 L140,176" class="ln" marker-end="url(#a)"/>
<rect x="40" y="178" width="200" height="56" rx="7" class="box"/>
<text x="52" y="200" class="tb" text-anchor="start">search similar</text>
<text x="52" y="220" class="s" text-anchor="start">FTS5 + word overlap</text>
<path d="M140,234 L140,268" class="ln" marker-end="url(#a)"/>
<rect x="40" y="270" width="200" height="140" rx="7" class="box"/>
<text x="54" y="292" class="t" text-anchor="start">≥85% same  -&gt; reinforce</text>
<text x="54" y="312" class="m" text-anchor="start">            (count +1)</text>
<text x="54" y="338" class="tw" text-anchor="start">opposite   -&gt; CONFLICT</text>
<text x="54" y="358" class="m" text-anchor="start">            supersede old</text>
<text x="54" y="384" class="t" text-anchor="start">new        -&gt; add</text>
<text x="54" y="402" class="m" text-anchor="start">            hidden, never deleted</text>
<rect x="330" y="92" width="190" height="72" rx="7" class="box"/>
<text x="342" y="114" class="tb" text-anchor="start">transcripts</text>
<text x="342" y="134" class="s" text-anchor="start">tool errors</text>
<text x="342" y="151" class="s" text-anchor="start">your corrections</text>
<rect x="560" y="92" width="190" height="72" rx="7" class="warn"/>
<text x="572" y="114" class="tw" text-anchor="start">inbox</text>
<text x="572" y="134" class="s" text-anchor="start">deduped by signature</text>
<text x="572" y="151" class="s" text-anchor="start">x3 = RECURRING ERROR</text>
<rect x="560" y="222" width="190" height="72" rx="7" class="box"/>
<text x="572" y="244" class="tb" text-anchor="start">reflect</text>
<text x="572" y="264" class="s" text-anchor="start">concrete cause -&gt;</text>
<text x="572" y="281" class="s" text-anchor="start">one destination</text>
<rect x="330" y="222" width="190" height="72" rx="7" class="box"/>
<text x="342" y="244" class="tb" text-anchor="start">lesson</text>
<text x="342" y="264" class="s" text-anchor="start">"when X, do Y,</text>
<text x="342" y="281" class="s" text-anchor="start">because Z"</text>
<rect x="330" y="340" width="190" height="72" rx="7" class="acc"/>
<text x="342" y="362" class="ta" text-anchor="start">RULE</text>
<text x="342" y="382" class="s" text-anchor="start">reinforced twice</text>
<text x="342" y="399" class="s" text-anchor="start">shown every session</text>
<rect x="560" y="340" width="190" height="72" rx="7" class="box"/>
<text x="572" y="362" class="tb" text-anchor="start">next session</text>
<text x="572" y="382" class="s" text-anchor="start">follows the rule</text>
<text x="572" y="399" class="s" text-anchor="start">fewer corrections</text>
<path d="M520,128 L558,128" class="ln" marker-end="url(#a)"/>
<path d="M655,164 L655,220" class="lw" marker-end="url(#aw)"/>
<path d="M558,258 L522,258" class="ln" marker-end="url(#a)"/>
<path d="M425,294 L425,338" class="la" marker-end="url(#aa)"/>
<path d="M520,376 L558,376" class="la" marker-end="url(#aa)"/>
<path d="M750,376 L800,376 L800,128 L752,128" class="dash"/>
<text x="812" y="250" class="m" text-anchor="start">loop</text>
<text x="330" y="82" class="m" text-anchor="start">harvested by Stop / PreCompact / SessionEnd hooks</text>
</svg>
