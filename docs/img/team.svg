<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Lead, CTO and workers: how agents coordinate">
<title>Lead, CTO and workers: how agents coordinate</title>
<style>
.h{font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#111}
.sub{font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#666}
.t{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#111}
.tb{font:600 12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#111}
.s{font:12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#555}
.m{font:11px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#888}
.ta{font:600 12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#3451d1}
.box{fill:#fbfbfb;stroke:#d4d4d4;stroke-width:1.1}
.acc{fill:#f1f4ff;stroke:#3451d1;stroke-width:1.2}
.warn{fill:#fff6ee;stroke:#d9480f;stroke-width:1.2}
.tw{font:600 12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:#d9480f}
.ln{stroke:#a3a3a3;stroke-width:1.1;fill:none}
.la{stroke:#3451d1;stroke-width:1.3;fill:none}
.lw{stroke:#d9480f;stroke-width:1.3;fill:none}
.dash{stroke:#c4c4c4;stroke-width:1;fill:none;stroke-dasharray:3 4}
.dot{fill:#111}.dota{fill:#3451d1}
.cell{fill:#e9e9e9}.cella{fill:#3451d1}
.ah{fill:#a3a3a3}.aha{fill:#3451d1}.ahw{fill:#d9480f}
@media (prefers-color-scheme: dark){
.h,.t,.tb{fill:#ececec}.sub{fill:#a0a0a0}.s{fill:#b0b0b0}.m{fill:#8a8a8a}
.ta{fill:#8aa4ff}.tw{fill:#ff8a4c}
.box{fill:#141414;stroke:#3a3a3a}.acc{fill:#121a33;stroke:#8aa4ff}.warn{fill:#2a1709;stroke:#ff8a4c}
.ln{stroke:#6a6a6a}.la{stroke:#8aa4ff}.lw{stroke:#ff8a4c}.dash{stroke:#444}
.dot{fill:#ececec}.dota{fill:#8aa4ff}.cell{fill:#2c2c2c}.cella{fill:#8aa4ff}
.ah{fill:#6a6a6a}.aha{fill:#8aa4ff}.ahw{fill:#ff8a4c}}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="aha"/></marker>
<marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ahw"/></marker>
</defs>
<text x="28" y="36" class="h" text-anchor="start">You lead. Claude is the CTO. Subagents are workers.</text>
<text x="28" y="58" class="sub" text-anchor="start">Workers talk on a shared board instead of flooding the CTO's context; every report is checked against the repo.</text>
<rect x="350" y="80" width="200" height="62" rx="7" class="acc"/>
<text x="362" y="102" class="ta" text-anchor="start">you  ·  lead</text>
<text x="362" y="122" class="s" text-anchor="start">goals, taste, scope, irreversible</text>
<path d="M450,142 L450,170" class="la" marker-end="url(#aa)"/>
<rect x="320" y="172" width="260" height="62" rx="7" class="box"/>
<text x="332" y="194" class="tb" text-anchor="start">main agent  ·  CTO</text>
<text x="332" y="214" class="s" text-anchor="start">plans, ADRs, delegates, integrates</text>
<rect x="110" y="330" width="190" height="62" rx="7" class="box"/>
<text x="122" y="352" class="tb" text-anchor="start">worker api</text>
<text x="122" y="372" class="s" text-anchor="start">claims src/api/*</text>
<path d="M450,234 L450,300 L205,300 L205,328" class="ln" marker-end="url(#a)"/>
<rect x="360" y="330" width="190" height="62" rx="7" class="box"/>
<text x="372" y="352" class="tb" text-anchor="start">worker ui</text>
<text x="372" y="372" class="s" text-anchor="start">claims src/ui/*</text>
<path d="M450,234 L450,300 L455,300 L455,328" class="ln" marker-end="url(#a)"/>
<rect x="610" y="330" width="190" height="62" rx="7" class="box"/>
<text x="622" y="352" class="tb" text-anchor="start">reviewer</text>
<text x="622" y="372" class="s" text-anchor="start">read-only check</text>
<path d="M450,234 L450,300 L705,300 L705,328" class="ln" marker-end="url(#a)"/>
<rect x="28" y="172" width="230" height="104" rx="7" class="box"/>
<text x="42" y="194" class="tb" text-anchor="start">mem chat</text>
<text x="42" y="214" class="ta" text-anchor="start">#plan</text>
<text x="112" y="214" class="s" text-anchor="start">decisions, @main ?</text>
<text x="42" y="232" class="ta" text-anchor="start">#claims</text>
<text x="112" y="232" class="s" text-anchor="start">who owns which files</text>
<text x="42" y="250" class="ta" text-anchor="start">#reports</text>
<text x="112" y="250" class="s" text-anchor="start">auto-posted on stop</text>
<text x="42" y="268" class="m" text-anchor="start">overlapping claims are refused</text>
<path d="M258,224 L318,204" class="dash"/>
<rect x="642" y="172" width="230" height="104" rx="7" class="warn"/>
<text x="656" y="194" class="tw" text-anchor="start">hallucination check</text>
<text x="656" y="214" class="s" text-anchor="start">report cites a file, line or</text>
<text x="656" y="232" class="s" text-anchor="start">symbol that doesn't exist?</text>
<text x="656" y="250" class="s" text-anchor="start">-&gt; worker is sent back once</text>
<text x="656" y="268" class="s" text-anchor="start">-&gt; then @main gets a blocker</text>
<path d="M757,328 L757,278" class="lw" marker-end="url(#aw)"/>
<text x="450" y="420" class="m" text-anchor="middle">workers: edit only claimed files · no memory writes · no architecture calls · escalate with @main</text>
</svg>
