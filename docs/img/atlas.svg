<path d="M464,99 L474,142" class="ln"/>
<rect x="366" y="115" width="98" height="22" rx="4" class="acc"/>
<text x="415" y="130" class="ta" text-anchor="middle">parse 2</text>
<path d="M356,142 L364,126" class="ln"/>
<path d="M464,126 L474,142" class="ln"/>
<rect x="366" y="142" width="98" height="22" rx="4" class="acc"/>
<text x="415" y="157" class="ta" text-anchor="middle">parse 3</text>
<path d="M356,142 L364,153" class="ln"/>
<path d="M464,153 L474,142" class="ln"/>
<rect x="366" y="169" width="98" height="22" rx="4" class="acc"/>
<text x="415" y="184" class="ta" text-anchor="middle">parse 4</text>
<path d="M356,142 L364,180" class="ln"/>
<path d="M464,180 L474,142" class="ln"/>
<text x="415" y="82" class="m" text-anchor="middle">fork</text>
<path d="M476,142 L500,142" class="ln" marker-end="url(#a)"/>
<text x="488" y="132" class="m" text-anchor="middle">join</text>
<rect x="502" y="96" width="136" height="92" rx="7" class="box"/>
<text x="514" y="118" class="tb" text-anchor="start">reduce</text>
<text x="514" y="138" class="s" text-anchor="start">bulk writes</text>
<text x="514" y="155" class="s" text-anchor="start">lazy: re-resolve</text>
<text x="514" y="172" class="s" text-anchor="start">only what changed</text>
<path d="M638,142 L666,142" class="la" marker-end="url(#aa)"/>
<rect x="668" y="82" width="204" height="120" rx="7" class="acc"/>
<text x="680" y="104" class="ta" text-anchor="start">atlas.db</text>
<text x="680" y="124" class="s" text-anchor="start">symbols · signatures · docs</text>
<text x="680" y="141" class="s" text-anchor="start">calls (resolved graph)</text>
<text x="680" y="158" class="s" text-anchor="start">imports · tests</text>
<text x="680" y="175" class="s" text-anchor="start">doc chunks</text>
<text x="680" y="192" class="s" text-anchor="start">FTS5 + porter stemming</text>
<rect x="28" y="252" width="160" height="62" rx="7" class="box"/>
<text x="40" y="274" class="tb" text-anchor="start">mem code search</text>
<text x="40" y="294" class="s" text-anchor="start">words -&gt; path:line</text>
<path d="M770,202 L770,226 L108,226 L108,250" class="ln" marker-end="url(#a)"/>
<rect x="199" y="252" width="160" height="62" rx="7" class="box"/>
<text x="211" y="274" class="tb" text-anchor="start">mem code explain</text>
<text x="211" y="294" class="s" text-anchor="start">callers, tests, ADRs</text>
<path d="M770,202 L770,226 L279,226 L279,250" class="ln" marker-end="url(#a)"/>
<rect x="370" y="252" width="160" height="62" rx="7" class="box"/>
<text x="382" y="274" class="tb" text-anchor="start">mem code flow</text>
<text x="382" y="294" class="s" text-anchor="start">what really happens</text>
<path d="M770,202 L770,226 L450,226 L450,250" class="ln" marker-end="url(#a)"/>
<rect x="541" y="252" width="160" height="62" rx="7" class="box"/>
<text x="553" y="274" class="tb" text-anchor="start">mem code brief</text>
<text x="553" y="294" class="s" text-anchor="start">context for a worker</text>
<path d="M770,202 L770,226 L621,226 L621,250" class="ln" marker-end="url(#a)"/>
<rect x="712" y="252" width="160" height="62" rx="7" class="box"/>
<text x="724" y="274" class="tb" text-anchor="start">mem code site</text>
<text x="724" y="294" class="s" text-anchor="start">offline docs + graphs</text>
<path d="M770,202 L770,226 L792,226 L792,250" class="ln" marker-end="url(#a)"/>
<text x="450" y="346" class="m" text-anchor="middle">measured: 518 files -&gt; full 1.2s · no-op 0.03s · one changed file 0.08s · search ~10ms</text>
